<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AJU FASHION - Order Success</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <div class="container">
            <h1>AJU FASHION</h1>
            <p>Order Confirmation</p>
        </div>
    </header>

    <section class="container" style="padding: 70px 0;">

        <div style="
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 45px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        ">

            <h2 style="margin-bottom: 20px;">
                Order Placed Successfully! 🎉
            </h2>

            <p style="font-size: 18px; margin-bottom: 15px;">
                Thank you for shopping with AJU FASHION.
            </p>

            <p style="font-size: 20px; margin-bottom: 25px;">
                Your Order ID:
                <strong>#{{ order_id }}</strong>
            </p>

            <p style="margin-bottom: 30px;">
                Please save your Order ID to track your order.
            </p>

            <a href="/track-order" style="text-decoration: none;">
                <button>
                    Track My Order
                </button>
            </a>

            <br><br>

            <a href="/" style="
                color: #111;
                font-weight: bold;
                text-decoration: none;
            ">
                Continue Shopping
            </a>

        </div>

    </section>

    <footer>
        <div class="container">
            <p>© 2026 AJU FASHION</p>
        </div>
    </footer>

</body>

</html>
