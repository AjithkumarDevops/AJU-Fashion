<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AJU FASHION - Admin Login</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <div class="container">
            <h1>AJU FASHION</h1>
            <p>Admin Login</p>
        </div>
    </header>

    <section class="container" style="padding: 60px 0;">

        <div style="
            background: white;
            max-width: 450px;
            margin: auto;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        ">

            <h2 style="text-align: center; margin-bottom: 30px;">
                Admin Login
            </h2>

            {% if error %}

            <p style="
                background: #ffe5e5;
                color: #cc0000;
                padding: 12px;
                text-align: center;
                margin-bottom: 20px;
                border-radius: 5px;
            ">
                {{ error }}
            </p>

            {% endif %}

            <form action="/admin/login" method="POST">

                <label>
                    <strong>Username</strong>
                </label>

                <input
                    type="text"
                    name="username"
                    required
                    placeholder="Enter admin username"
                    style="
                        width: 100%;
                        padding: 12px;
                        margin: 10px 0 20px;
                        border: 1px solid #ccc;
                        border-radius: 5px;
                    "
                >

                <label>
                    <strong>Password</strong>
                </label>

                <input
                    type="password"
                    name="password"
                    required
                    placeholder="Enter admin password"
                    style="
                        width: 100%;
                        padding: 12px;
                        margin: 10px 0 25px;
                        border: 1px solid #ccc;
                        border-radius: 5px;
                    "
                >

                <button
                    type="submit"
                    style="width: 100%;"
                >
                    Login
                </button>

            </form>

        </div>

    </section>

    <footer>
        <div class="container">
            <p>© 2026 AJU FASHION - Admin Panel</p>
        </div>
    </footer>

</body>

</html>
