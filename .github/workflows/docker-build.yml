name: AJU Fashion CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: aju-fashion
  EC2_INSTANCE_ID: i-05abd506f8e7ca8f0

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }} .
          docker tag $REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            $REGISTRY/${{ env.ECR_REPOSITORY }}:latest

      - name: Push Docker image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker push $REGISTRY/${{ env.ECR_REPOSITORY }}:latest

      - name: Deploy to EC2 using SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws ecr get-login-password --region us-east-1 | sudo docker login --username AWS --password-stdin 236087862934.dkr.ecr.us-east-1.amazonaws.com",
              "sudo docker pull 236087862934.dkr.ecr.us-east-1.amazonaws.com/aju-fashion:latest",
              "sudo docker stop aju-fashion || true",
              "sudo docker rm aju-fashion || true",
              "sudo docker run -d --name aju-fashion -p 5000:5000 236087862934.dkr.ecr.us-east-1.amazonaws.com/aju-fashion:latest"
            ]' \
            --region "${{ env.AWS_REGION }}"